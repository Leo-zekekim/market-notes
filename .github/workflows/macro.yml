name: 주요 지표·거래대금 상위 수집

on:
  schedule:
    # 한국 시간 평일 08:20 (UTC 일~목 23:20) — 장 시작 전
    - cron: "20 23 * * 0-4"
    # 한국 시간 평일 16:00 (UTC 월~금 07:00) — 장 마감 후
    - cron: "0 7 * * 1-5"
    # 한국 시간 평일 20:10 (UTC 월~금 11:10) — 시간외(넥스트레이드) 종료 후 최종값
    - cron: "10 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지표 받기
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_macro.py
        continue-on-error: true

      - name: 거래대금 상위 종목 받기
        # 아침 실행은 장전 거래 가격이 섞이므로 건너뛴다
        if: github.event.schedule != '20 23 * * 0-4'
        run: python scripts/fetch_stocks.py
        continue-on-error: true

      - name: 변경 사항 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "주요 지표 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
