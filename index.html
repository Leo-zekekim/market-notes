<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일일 증시 아카이브</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: date rail on the left (chips on phone), report ledger on the right; summary tiles first, detail below. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#151b26; --muted:#5d6676; --line:#dde2ea;
  --accent:#1d4e6e; --accent-soft:#e3edf3;
  --up:#d1302a; --up-soft:#fbe9e8; --down:#1c5bd0; --down-soft:#e6eefb; --flat:#7a8291;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171d27; --ink:#e7ebf1; --muted:#97a1b1; --line:#2a3240;
  --accent:#7fb3d6; --accent-soft:#1d2a37;
  --up:#ff6b61; --up-soft:#3a1d1c; --down:#6b9dff; --down-soft:#1a2740; --flat:#8c94a3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171d27; --ink:#e7ebf1; --muted:#97a1b1; --line:#2a3240;
  --accent:#7fb3d6; --accent-soft:#1d2a37;
  --up:#ff6b61; --up-soft:#3a1d1c; --down:#6b9dff; --down-soft:#1a2740; --flat:#8c94a3; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
header.top{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* date rail */
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
.rail h2{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600}
.rail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:7px 10px;border-radius:6px;font-size:14px}
.rail button:hover{background:var(--accent-soft)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.rail .pct{font-size:12px}
.rail .count{margin-top:12px;font-size:12px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:28px}
.dateline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dateline h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.dateline .wd{color:var(--muted);font-size:15px}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.pre{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.closed{background:var(--ink);color:var(--bg);border-color:transparent}
.updated{font-size:12px;color:var(--muted)}
.rail .pre{font-size:11px;color:var(--accent)}
.verdict{margin:0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;max-width:72ch}
.verdict b{color:var(--accent);margin-right:6px}
/* ticker board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tick{background:var(--surface);box-shadow:0 0 0 .5px var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tick .nm{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tick .nm em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tick .cl{font-size:21px;font-weight:600}
.tick .ch{font-size:13px}
.tick .note{font-size:12px;margin-top:2px;color:var(--up);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.macro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.macro .tick .cl{font-size:18px}
.macro .tick .note{color:var(--muted);font-weight:400}
.macro .unit{font-size:12px;color:var(--muted);margin-left:3px;font-family:var(--f-sans);font-weight:400}
.grp{font-size:11px;color:var(--muted)}
section h3{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
/* trend */
.trend{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.trend .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.trend .tabs button{all:unset;cursor:pointer;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px}
.trend .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trend .tabs button:focus-visible{outline:2px solid var(--accent)}
.trend svg{width:100%;height:auto;display:block}
.trend .empty{color:var(--muted);font-size:14px;padding:18px 4px}
/* flows */
.flow{display:flex;flex-direction:column;gap:8px}
.flow .row{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;align-items:center;gap:10px;font-size:14px}
.flow .bar{position:relative;height:14px;background:transparent}
.flow .bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.flow .bar span{position:absolute;top:0;bottom:0;border-radius:2px}
.flow .v{text-align:right}
.flow .foot{font-size:12px;color:var(--muted);margin-top:4px}
/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td .code{color:var(--muted);font-size:12px;margin-left:6px}
ul.points{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.news-empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:16px;color:var(--muted);font-size:14px}
.news{display:flex;flex-direction:column;gap:10px}
.news a{color:var(--ink);text-decoration:none;font-weight:600}
.news a:hover{text-decoration:underline;color:var(--accent)}
.news .meta{font-size:12px;color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.state{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px;max-width:60ch}
.state h2{margin:0 0 6px;font-size:18px}
.state p{margin:0;color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  nav.rail{position:static}
  .rail ul{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail li{flex:0 0 auto}
  .rail button{border:1px solid var(--line);width:auto}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .dateline h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>일일 증시 아카이브</h1>
    <span class="sub">한국·미국 장마감 리포트 모음 · 상승 <span class="up">빨강</span> / 하락 <span class="down">파랑</span></span>
  </header>
  <nav class="rail" aria-label="리포트 날짜">
    <h2>리포트</h2>
    <ul id="dates"></ul>
    <div class="count" id="count"></div>
  </nav>
  <main id="main">
    <div class="state"><h2>리포트를 불러오는 중입니다</h2><p>매일 장마감 리포트가 여기에 날짜별로 쌓입니다.</p></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d=2) => n==null||isNaN(n) ? "–" : Number(n).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const dir = n => n>0?"up":n<0?"down":"flat";
const sign = n => n>0?"+":"";
const arrow = n => n>0?"▲":n<0?"▼":"–";
const WD = ["일","월","화","수","목","금","토"];
let reports = [], current = null, trendKey = "코스피", macroData = null, longKey = "kr3y";

function longDate(id){const [y,m,d]=id.split("-").map(Number);const w=WD[new Date(y,m-1,d).getDay()];return {txt:`${y}년 ${m}월 ${d}일`,wd:`${w}요일`};}

function renderRail(){
  $("#dates").innerHTML = reports.map(r=>{
    const k = (r.indices||[]).find(i=>i.name==="코스피");
    const [,m,d] = r.id.split("-");
    return `<li><button data-id="${esc(r.id)}" aria-current="${r.id===current}"><span class="num">${+m}.${+d}</span>${r.status==="premarket"?`<span class="pre">장 시작 전</span>`:k?`<span class="pct num ${dir(k.pct)}">${sign(k.pct)}${fmt(k.pct)}%</span>`:""}</button></li>`;
  }).join("");
  $("#count").textContent = reports.length ? `총 ${reports.length}건` : "";
}

function trendSVG(key){
  const pts = reports.slice().reverse().map(r=>{const i=(r.indices||[]).find(x=>x.name===key);return i?{id:r.id,v:i.close}:null}).filter(Boolean);
  if(pts.length<2) return `<div class="empty">리포트가 2건 이상 쌓이면 ${esc(key)} 추이가 여기에 그려집니다. 현재 ${pts.length}건.</div>`;
  const W=760,H=200,pl=58,pr=16,pt=14,pb=28;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const pad=(hi-lo)*.12||hi*.01;lo-=pad;hi+=pad;
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0:i/(pts.length-1));const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[0,.5,1].map(t=>lo+(hi-lo)*t);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=`${line}L${x(pts.length-1)},${H-pb}L${x(0)},${H-pb}Z`;
  const last=pts[pts.length-1], first=pts[0], c=last.v>=first.v?"var(--up)":"var(--down)";
  const step=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} 종가 추이">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(t,0)}</text>`).join("")}
    <path d="${area}" fill="${c}" opacity=".10"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${+p.id.slice(5,7)}.${+p.id.slice(8)}</text>`:"").join("")}
    <circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="4" fill="${c}"/>
  </svg>`;
}

function flowBlock(rows, foot){
  if(!rows||!rows.length) return "";
  const max=Math.max(...rows.map(r=>Math.abs(r.amount)))||1;
  return `<div class="flow">${rows.map(r=>{const w=Math.abs(r.amount)/max*50;const pos=r.amount>=0;
    return `<div class="row"><span>${esc(r.investor)}</span><div class="bar"><span style="${pos?`left:50%`:`right:50%`};width:${w}%;background:var(--${pos?"up":"down"})"></span></div><span class="v num ${dir(r.amount)}">${sign(r.amount)}${fmt(r.amount,0)}</span></div>`}).join("")}
    ${foot?`<div class="foot">${esc(foot)}</div>`:""}</div>`;
}

function stockTable(rows){
  if(!rows||!rows.length) return "";
  return `<div class="tbl"><table><thead><tr><th>종목</th><th class="r">현재가</th><th class="r">등락률</th></tr></thead><tbody>${rows.map(s=>
    `<tr><td>${esc(s.name)}<span class="code num">${esc(s.code)}</span></td><td class="r num">${fmt(s.price,0)}</td><td class="r num ${dir(s.pct)}">${sign(s.pct)}${fmt(s.pct)}%</td></tr>`).join("")}</tbody></table></div>`;
}

function macroTick(m){
  const isRate=m.unit==="%";
  const dec=m.decimals??(isRate?3:(m.value>=10000?0:2));
  const val=(m.unit==="$"?"$":"")+fmt(m.value,dec)+(m.unit&&m.unit!=="$"?`<span class="unit">${esc(m.unit)}</span>`:"");
  let ch="";
  if(m.change!=null){
    ch = isRate ? `${arrow(m.change)} ${fmt(Math.abs(m.change*100),1)}bp`
                : `${arrow(m.change)} ${fmt(Math.abs(m.change),dec)}${m.pct!=null?` (${sign(m.pct)}${fmt(m.pct)}%)`:""}`;
  } else if(m.pct!=null){ ch=`${arrow(m.pct)} ${sign(m.pct)}${fmt(m.pct)}%`; }
  const d=m.change!=null?m.change:m.pct;
  return `<div class="tick"><div class="nm"><span>${esc(m.name)}</span>${m.group?`<span class="grp">${esc(m.group)}</span>`:""}</div><div class="cl num">${val}</div>${ch?`<div class="ch num ${dir(d)}">${ch}</div>`:""}${m.note?`<div class="note">${esc(m.note)}</div>`:""}</div>`;
}

function emptyNote(r){return `<div class="news-empty">${r.status==="premarket"?"장 마감 후 업데이트됩니다.":"이번 리포트에서는 확인하지 못한 항목입니다."}</div>`;}

// 공식 API 지표: 리포트 날짜 기준 값(그 날짜 이전 마지막 관측값)
function macroAsOf(dateId){
  if(!macroData||!macroData.series) return [];
  const out=[];
  for(const k of (macroData.order||Object.keys(macroData.series))){
    const s=macroData.series[k]; if(!s||!s.points||!s.points.length) continue;
    const pts=s.points.filter(p=>p[0]<=dateId);
    if(!pts.length) continue;
    const last=pts[pts.length-1], prev=pts.length>1?pts[pts.length-2]:null;
    const m={name:s.name,group:s.group,unit:s.unit,value:last[1],src:s.source,date:last[0]};
    if(prev){m.change=+(last[1]-prev[1]).toFixed(4); if(s.unit!=="%"&&prev[1]) m.pct=+((last[1]-prev[1])/prev[1]*100).toFixed(2);}
    if(s.unit==="원") m.decimals=1;
    out.push(m);
  }
  return out;
}
function mergedMacro(r){
  // 공식 값이 리포트 날짜보다 3일 넘게 오래됐고 리포트에 같은 지표가 있으면 리포트 값을 쓴다
  const rep=new Map((r.macro||[]).map(m=>[m.name,m]));
  const cutoff=new Date(Date.parse(r.id)-3*864e5).toISOString().slice(0,10);
  const api=macroAsOf(r.id).map(m=>(m.date<cutoff&&rep.has(m.name))?rep.get(m.name):m);
  const names=new Set(api.map(m=>m.name));
  const extra=(r.macro||[]).filter(m=>!names.has(m.name));
  return api.concat(extra);
}
const SRC={ECOS:"한국은행",FRED:"FRED",COINGECKO:"CoinGecko"};
function srcLine(m){ if(!m.src) return m.note||""; const [,mo,d]=m.date.split("-"); return `${SRC[m.src]||m.src} · ${+mo}/${+d}`; }

function seriesSVG(pts, unit){
  if(!pts||pts.length<2) return `<div class="empty">표시할 데이터가 아직 없습니다.</div>`;
  const W=760,H=220,pl=62,pr=16,pt=14,pb=28;
  const vals=pts.map(p=>p[1]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.1||Math.abs(hi)*.01||1;lo-=pad;hi+=pad;
  const t0=Date.parse(pts[0][0]),t1=Date.parse(pts[pts.length-1][0]);
  const x=d=>pl+(W-pl-pr)*((Date.parse(d)-t0)/((t1-t0)||1));const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const dec=unit==="%"?2:(hi>=1000?0:2);
  const ticks=[0,.25,.5,.75,1].map(t=>lo+(hi-lo)*t);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const last=pts[pts.length-1];
  const months=[];
  for(let t=t0;t<=t1;t+=14*864e5) months.push(new Date(t).toISOString().slice(0,10));
  const step=Math.ceil(months.length/7);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="3개월 추이">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(t,dec)}</text>`).join("")}
    ${months.map((d,i)=>i%step===0?`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${+d.slice(5,7)}/${+d.slice(8,10)}</text>`:"").join("")}
    <path d="${line}L${x(last[0])},${H-pb}L${x(pts[0][0])},${H-pb}Z" fill="var(--accent)" opacity=".08"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--accent)"/>
  </svg>`;
}
function longBlock(){
  if(!macroData||!macroData.series) return "";
  const keys=(macroData.order||[]).filter(k=>macroData.series[k]&&macroData.series[k].points?.length>1);
  if(!keys.length) return "";
  if(!keys.includes(longKey)) longKey=keys[0];
  const s=macroData.series[longKey];
  const from=new Date(Date.parse(current)-92*864e5).toISOString().slice(0,10);
  const pts=s.points.filter(p=>p[0]<=current&&p[0]>=from);
  const last=pts[pts.length-1];
  return `<section class="trend" id="long"><h3>지표 3개월 추이</h3>
    <div class="tabs">${keys.map(k=>`<button data-l="${k}" aria-pressed="${k===longKey}">${esc(macroData.series[k].name)}</button>`).join("")}</div>
    <div id="longchart">${seriesSVG(pts,s.unit)}</div>
    <p class="src">출처: ${SRC[s.source]||s.source}${last?` · 최근 ${last[0]} ${fmt(last[1],s.unit==="%"?3:2)}${s.unit&&s.unit!=="$"?s.unit:""}`:""} · 자동 수집 ${esc(macroData.updatedAt||"")}</p>
  </section>`;
}

function renderReport(){
  const r = reports.find(x=>x.id===current);
  if(!r){$("#main").innerHTML=`<div class="state"><h2>아직 올라온 리포트가 없습니다</h2><p>장마감 리포트가 생성되면 날짜별로 이곳에 자동으로 추가됩니다.</p></div>`;return;}
  const d=longDate(r.id);
  const idx=r.indices||[];
  const fx=r.fx;
  const flows=r.flows||{};
  $("#main").innerHTML = `
    <div class="dateline"><h2>${d.txt}</h2><span class="wd">${d.wd}</span>${r.status==="premarket"?`<span class="badge pre">장 시작 전</span>`:`<span class="badge closed">장 마감</span>`}${r.updatedAt?`<span class="updated">${esc(r.updatedAt)} 업데이트</span>`:""}</div>
    ${r.summary?`<p class="verdict"><b>${r.status==="premarket"?"개장 전 요약":"총평"}</b>${esc(r.summary)}</p>`:""}
    ${(r.preview||[]).length?`<section><h3>오늘의 관전 포인트</h3><ul class="points">${r.preview.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></section>`:""}
    <div class="board">
      ${idx.map(i=>`<div class="tick"><div class="nm"><span>${esc(i.name)}</span>${i.region==="US"?"<em>미국</em>":""}</div>
        <div class="cl num">${fmt(i.close)}</div>
        <div class="ch num ${dir(i.change)}">${arrow(i.change)} ${fmt(Math.abs(i.change))} (${sign(i.pct)}${fmt(i.pct)}%)</div>
        ${i.note?`<div class="note">${esc(i.note)}</div>`:""}</div>`).join("")}
      ${fx?`<div class="tick"><div class="nm"><span>원/달러</span></div><div class="cl num">${fmt(fx.usdkrw,1)}</div><div class="ch num ${dir(fx.change)}">${arrow(fx.change)} ${fmt(Math.abs(fx.change),1)}원</div></div>`:""}
    </div>
    ${(()=>{const mm=mergedMacro(r);return mm.length?`<section><h3>주요 지표 · 금리 · 원자재 · 코인</h3><div class="macro">${mm.map(m=>macroTick({...m,note:srcLine(m)})).join("")}</div></section>`:""})()}
    <section class="trend"><h3>지수 추이</h3>
      <div class="tabs">${["코스피","코스닥","S&P500","나스닥"].map(k=>`<button data-k="${k}" aria-pressed="${k===trendKey}">${k}</button>`).join("")}</div>
      <div id="chart">${trendSVG(trendKey)}</div>
    </section>
    ${longBlock()}
    <div class="grid2">
      <section><h3>코스피 수급 (억원)</h3>${flowBlock(flows.kospi, flows.kosdaqNote)||emptyNote(r)}</section>
      <section><h3>미국 증시 동향</h3><ul class="points">${(r.usNotes||[]).map(n=>`<li>${esc(n)}</li>`).join("")}</ul></section>
    </div>
    <div class="grid2">
      <section><h3>코스피 거래대금 상위</h3>${stockTable((r.stocks||{}).kospi)||emptyNote(r)}</section>
      <section><h3>코스닥 거래대금 상위</h3>${stockTable((r.stocks||{}).kosdaq)||emptyNote(r)}</section>
    </div>
    ${(r.global||[]).length?`<section><h3>글로벌 지수</h3><div class="tbl"><table><thead><tr><th>지수</th><th class="r">종가</th><th class="r">등락률</th></tr></thead><tbody>${r.global.map(g=>`<tr><td>${esc(g.name)}</td><td class="r num">${fmt(g.close,0)}</td><td class="r num ${dir(g.pct)}">${sign(g.pct)}${fmt(g.pct)}%</td></tr>`).join("")}</tbody></table></div></section>`:""}
    ${(r.insights||[]).length?`<section><h3>시사점 및 특이사항</h3><ul class="points">${r.insights.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></section>`:""}
    <section><h3>경제 뉴스</h3>${(r.news||[]).length?`<div class="news">${r.news.map(n=>`<div>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:`<b>${esc(n.title)}</b>`}<div class="meta">${esc(n.source||"")}</div>${n.summary?`<div>${esc(n.summary)}</div>`:""}</div>`).join("")}</div>`:`<div class="news-empty">이 날짜에는 뉴스 항목이 없습니다. 다음 리포트부터 주요 경제 뉴스가 함께 올라옵니다.</div>`}</section>
    ${(r.sources||[]).length?`<p class="src">출처: ${r.sources.map(esc).join(" · ")}</p>`:""}
  `;
}

function render(){renderRail();renderReport();}

function pick(id){current=id;try{history.replaceState(null,"","#d"+id)}catch(e){location.hash="d"+id}render();window.scrollTo({top:0});}

document.addEventListener("click",e=>{
  const l=e.target.closest("#long .tabs button");if(l){longKey=l.dataset.l;const sec=document.getElementById("long");sec.outerHTML=longBlock();return;}
  const b=e.target.closest(".rail button");if(b){pick(b.dataset.id);return;}
  const t=e.target.closest(".trend .tabs button");if(t){trendKey=t.dataset.k;document.querySelectorAll(".trend .tabs button").forEach(x=>x.setAttribute("aria-pressed",x===t));$("#chart").innerHTML=trendSVG(trendKey);}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(2);if(reports.some(r=>r.id===h)){current=h;render();}});

(async()=>{
  try{
    const macroP = fetch("data/macro.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
    const idx = await (await fetch("reports/index.json",{cache:"no-store"})).json();
    const ids = (idx.reports||[]).slice().sort().reverse();
    reports = (await Promise.all(ids.map(id=>fetch(`reports/${id}.json`,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)))).filter(Boolean).map(r=>({id:r.date,...r}));
    const h=location.hash.slice(2);
    current = reports.some(r=>r.id===h)?h:(reports[0]?.id??null);
    macroData = await macroP;
    render();
  }catch(e){
    $("#main").innerHTML=`<div class="state"><h2>리포트를 불러오지 못했습니다</h2><p>잠시 후 새로고침해 주세요.</p></div>`;
  }
})();
</script>

</body>
</html>
